spring.application.name=catalog

# 1. Conexiunea la baza de date MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/parfumerie_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:root}

# 2. Configuratii JPA si Hibernate
# 'update' va crea tabelele daca nu exista, bazat pe clasele Entity
spring.jpa.hibernate.ddl-auto=none
# Afiseaza interogarile SQL generate de Hibernate in consola
spring.jpa.show-sql=true

# 3. Importarea Datelor Initiale (Utilizatori si Parfumuri)
# Aceasta linie indica Spring sa execute fisierul data.sql la pornire
spring.sql.init.mode=always

# Dezactiveaza functia de initializare a bazei de date a lui Hibernate
# (care poate interfera cu executia data.sql in unele versiuni)
spring.jpa.defer-datasource-initialization=true

# JWT configuration
jwt.secret=${JWT_SECRET:change-me-secret-key-please-update}
jwt.expiration-ms=86400000

# Stripe configuration
stripe.api.key=${STRIPE_API_KEY:sk_test_your_api_key_here}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET:whsec_your_webhook_secret_here}

# 4. Specifica numele fisierelor (optional, dar clarifica)
# Acestea vor rula in ordinea schema, apoi data
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:date.sql