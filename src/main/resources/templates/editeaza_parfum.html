<!DOCTYPE html>
<html lang="ro" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Editează Parfum</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet"
          crossorigin="anonymous">

    <style>
        :root {
            --douglas-teal: #00969d;
            --douglas-accent: #b48c48;
        }
        body { background-color: #f7f7f7; padding: 30px; }
        .btn-custom {
            background-color: var(--douglas-accent);
            border-color: var(--douglas-accent);
            color: white;
            font-weight: bold;
        }
        .btn-custom:hover {
            background-color: #a07a3c;
            border-color: #a07a3c;
        }
    </style>
</head>
<body>
<div class="container">
    <h2 class="mb-4 text-primary">Editează Parfum (ID: <span th:text="${parfum.idParfum}"></span>)</h2>

    <form th:action="@{/parfumuri/update}" th:object="${parfum}" method="post">

        <input type="hidden" th:field="*{idParfum}" />
        <input type="hidden" th:field="*{idUtilizator}" />

        <div class="row g-3">
            <div class="col-md-6">
                <label for="numeParfum" class="form-label">Nume Parfum:</label>
                <input type="text" id="numeParfum" th:field="*{numeParfum}" class="form-control">
            </div>
            <div class="col-md-6">
                <label for="brand" class="form-label">Brand:</label>
                <input type="text" id="brand" th:field="*{brand}" class="form-control">
            </div>
            <div class="col-md-6">
                <label for="creator" class="form-label">Creator:</label>
                <input type="text" id="creator" th:field="*{creator}" class="form-control">
            </div>
            <div class="col-md-6">
                <label for="anulLansarii" class="form-label">An Lansare:</label>
                <input type="number" id="anulLansarii" th:field="*{anulLansarii}" class="form-control">
            </div>
            <div class="col-md-6">
                <label for="tipParfum" class="form-label">Tip Parfum:</label>
                <input type="text" id="tipParfum" th:field="*{tipParfum}" class="form-control">
            </div>
            <div class="col-md-6">
                <label for="pret" class="form-label">Preț (RON):</label>
                <input type="number" step="0.01" id="pret" th:field="*{pret}" class="form-control" required>
            </div>
            <div class="col-md-6">
                <label for="stoc" class="form-label">Stoc:</label>
                <input type="number" id="stoc" th:field="*{stoc}" class="form-control">
            </div>

            <div class="col-12">
                <h5 class="mt-3">Detalii Note</h5>
            </div>
            <div class="col-md-6">
                <label for="noteVarf" class="form-label">Note de Vârf:</label>
                <input type="text" id="noteVarf" th:field="*{noteVarf}" class="form-control">
            </div>
            <div class="col-md-6">
                <label for="noteBaza" class="form-label">Note de Bază:</label>
                <input type="text" id="noteBaza" th:field="*{noteBaza}" class="form-control">
            </div>

            <div class="col-12 mt-4">
                <button type="submit" class="btn btn-custom me-2">Actualizează Parfumul</button>
                <a th:href="@{/parfumuri}">Înapoi la listă</a>
            </div>
        </div>
    </form>
</div>
</body>
</html>
