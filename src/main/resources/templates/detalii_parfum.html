<!DOCTYPE html>
<html lang="ro" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="'Detalii Parfum: ' + ${parfum.numeParfum}">Detalii Parfum</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet"
          crossorigin="anonymous">

    <style>
        :root {
            --douglas-teal: #00969d;
            --douglas-accent: #b48c48;
        }
        body {
            background-color: #f7f7f7;
            padding-top: 50px; /* Spațiu în partea de sus */
        }
        .header-teal {
            background-color: var(--douglas-teal);
            color: white;
            padding: 15px;
            text-align: center;
        }
        .btn-custom {
            background-color: var(--douglas-accent);
            border-color: var(--douglas-accent);
            color: white;
            font-weight: bold;
        }
        .btn-custom:hover {
            background-color: #a07a3c;
            border-color: #a07a3c;
        }
        .card-shadow {
            box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075);
        }
        .detail-title {
            color: var(--douglas-teal);
            font-weight: bold;
        }
    </style>
</head>
<body>
<div class="container">

    <div class="row justify-content-center">
        <div class="col-md-8">

            <div class="card card-shadow mb-4">
                <div class="card-header header-teal">
                    <h4 th:text="'Detalii pentru: ' + ${parfum.numeParfum}" class="mb-0">Detalii Parfum</h4>
                </div>
                <div class="card-body">

                    <dl class="row">
                        <dt class="col-sm-4 detail-title">Brand:</dt>
                        <dd class="col-sm-8" th:text="${parfum.brand}"></dd>

                        <dt class="col-sm-4 detail-title">Creator:</dt>
                        <dd class="col-sm-8" th:text="${parfum.creator}"></dd>

                        <dt class="col-sm-4 detail-title">An Lansare:</dt>
                        <dd class="col-sm-8" th:text="${parfum.anulLansarii}"></dd>

                        <dt class="col-sm-4 detail-title">Tip Parfum:</dt>
                        <dd class="col-sm-8" th:text="${parfum.tipParfum}"></dd>

                        <dt class="col-sm-4 detail-title">Preț:</dt>
                        <dd class="col-sm-8"><strong class="text-danger" th:text="${parfum.pret} + ' RON'"></strong></dd>

                        <dt class="col-sm-4 detail-title">Stoc:</dt>
                        <dd class="col-sm-8" th:text="${parfum.stoc} + ' buc'"></dd>

                        <hr class="my-3"/>

                        <dt class="col-sm-4 detail-title">Note de Vârf:</dt>
                        <dd class="col-sm-8" th:text="${parfum.noteVarf}">Note Vârf</dd>

                        <dt class="col-sm-4 detail-title">Note de Bază:</dt>
                        <dd class="col-sm-8" th:text="${parfum.noteBaza}">Note Bază</dd>

                        <dt class="col-sm-4 text-muted">Adăugat de (ID):</dt>
                        <dd class="col-sm-8 text-muted" th:text="${parfum.idUtilizator}"></dd>
                    </dl>
                </div>
            </div>

            <div th:if="${esteEditor}" class="mb-3 text-center">
                <a th:href="@{/parfumuri/editeaza/{id}(id=${parfum.idParfum})}" class="btn btn-custom btn-lg">
                    <i class="bi bi-pencil"></i> Editează Parfumul
                </a>
            </div>

            <div class="text-center mt-4">
                <a th:href="@{/parfumuri}" class="btn btn-outline-secondary">
                    Înapoi la catalog
                </a>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        crossorigin="anonymous"></script>
</body>
</html>
